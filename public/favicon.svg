<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CHANBIN.">
  <!--
    파비콘 (ADR-0028).
    검은 사각형 위 흰 C 와 악센트 점 — 워드마크 `CHANBIN.` 의 첫 글자와 마침표다.
    탭에서는 5mm 남짓으로 줄어드는데, 이름 전체를 넣으면 아무것도 안 읽힌다.
    포트폴리오가 붓으로 흘려 쓴 P 를 쓰는 것과 같은 문법이다(같은 사람, 다른 자리).
  -->
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <path d="M45 21.5 C 40.5 17.5, 33 17, 27.5 21 C 21.5 25.5, 20.5 36, 25.5 42.5 C 30 48.5, 39 49.5, 44.5 45"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="50" cy="44" r="5" fill="#5fcdee"/>
</svg>
