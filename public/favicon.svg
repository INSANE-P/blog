<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="박찬빈">
  <!--
    파비콘 (ADR-0031).

    번개 하나와 점 하나. 둘 다 이 사이트가 이미 쓰고 있는 형태다 —
    번개는 링크에 마우스를 올렸을 때 지나가는 밑줄이고(ADR-0030),
    점은 워드마크 `CHANBIN.` 의 마침표다. 흰 번개에 악센트 점이라는 배색도
    워드마크와 같다(흰 글자 + 악센트 마침표).

    16px 에서 살아남는 것이 유일한 제약이라, 후보를 실제 크기로 렌더해 놓고 골랐다.
    글자 `C` 는 뭉개졌고 점이 획과 겹쳤다. 번개는 각이 굵어 작아져도 형태가 남는다.

    번개를 왼쪽으로 밀어 점에게 자리를 준다. 둘을 대각선으로 놓으면 16px 에서도
    두 개의 물체로 읽히고, 가운데 모으면 하나의 얼룩이 된다.
    곡선을 쓰지 않은 것은 워드마크가 기하학적 산세리프(Montserrat)라 결을 맞추기 위해서다.

    악센트는 다크 값(#5fcdee)을 쓴다. 검은 바탕 위에 놓이는 색이라 라이트 값은 탁하다.
    파비콘은 테마를 따라가지 않는다 — 브라우저 탭은 우리 화면 밖이다.
  -->
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <path d="M36 6 L11 34 L23 34 L19 55 L44 26 L31 26 Z" fill="#ffffff"/>
  <circle cx="48" cy="48" r="8" fill="#5fcdee"/>
</svg>
